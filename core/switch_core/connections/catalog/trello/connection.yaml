slug: trello
name: Trello
category: Project management
description: Work with Trello boards, lists and cards, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  refresh: rotating
  oauth:
    # Trello's MCP server does not document dynamic client registration, so
    # each server's operator registers a Trello OAuth app and saves it under
    # Connectors in the dashboard, or names its settings in
    # TRELLO_CLIENT_CONFIG_PATH. One connection is one Trello workspace.
    registration: static
    client_settings: TRELLO
    redirect: [core]
    unchecked: >-
      Switch can't check the redirect URI against Trello. Connect once to
      confirm it is set on your Trello OAuth app.
    revocation_discovered: false
    remove_access: >-
      To cut an agent's access, remove the authorized app in Trello under your
      account's Settings, Applications (or Power-Ups you have authorized); a
      token already handed out stays valid until it expires.
  # Trello's REST members/me endpoint names the connected account.
  identity:
    url: https://api.trello.com/1/members/me
    account_id: id
    label: username
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    # Trello's own remote MCP server (separate from the Atlassian server).
    - name: trello
      url: "https://mcp.trello.com/v1"
access:
  # Trello's OAuth offers read and read-write access. Read-only takes read;
  # write adds write. No account-admin scope.
  read:
    scopes:
      - read
  write:
    scopes:
      - read
      - write
tools: { mode: pass_through }
